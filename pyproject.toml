[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "idlenap"
version = "0.2.0"
description = "Swap out the memory of idle containers and let the kernel bring it back on the next request."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
idlenap = "idlenap:main"

[tool.setuptools]
py-modules = ["idlenap"]

[tool.ruff]
target-version = "py311"

[tool.ty.environment]
python-version = "3.11"
python-platform = "linux"
